<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ctxproxy — Live</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 28px; background: #0d1117; color: #e6edf3;
           font-family: 'Segoe UI', system-ui, sans-serif; }
    nav { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; font-size: .88rem; }
    nav a { color: #60a5fa; text-decoration: none; }
    h2 { font-size: 1rem; color: #93c5fd; margin-top: 26px; }
    .muted { color: #9aa7b4; font-size: .9rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
             gap: 12px; margin-top: 16px; }
    .card { background: #161b22; border: 1px solid #2d3644; border-radius: 10px;
            padding: 14px 16px; }
    .label { color: #9aa7b4; font-size: .75rem; text-transform: uppercase; }
    .value { font-size: 1.3rem; margin-top: 4px; font-family: Consolas, monospace; }
    pre { background: #161b22; border: 1px solid #2d3644; border-radius: 10px;
          padding: 16px; overflow: auto; font-size: .82rem; color: #a5d6ff; }
  </style>
</head>
<body>
  <nav>
    <a href="/_ctxproxy/">Overview</a>
    <a href="/_ctxproxy/live">Live</a>
    <a href="/_ctxproxy/sessions">Sessions</a>
    <a href="/_ctxproxy/requests">Requests</a>
    <a href="/_ctxproxy/waste">Waste</a>
    <a href="/_ctxproxy/transforms">Transforms</a>
    <a href="/_ctxproxy/pricing">Pricing</a>
    <a href="/_ctxproxy/settings">Settings</a>
  </nav>
  <h1>Live</h1>
  <p class="muted">v{{ version }} · mode {{ mode }}</p>
  <div class="cards">
    {% for key, value in counters.items() %}
    <div class="card"><div class="label">{{ key }}</div><div class="value">{{ value }}</div></div>
    {% endfor %}
  </div>
  <h2>Last request</h2>
  <pre>{{ last | tojson(indent=2) }}</pre>
  <h2>Quarantined</h2>
  <pre>{{ quarantined | tojson(indent=2) }}</pre>
</body>
</html>

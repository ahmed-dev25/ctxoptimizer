name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Sync environment
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy --strict src

      - name: Test
        run: uv run pytest -q --cov --cov-report=term-missing --cov-fail-under=80

  audit:
    name: dependency audit (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Sync environment
        run: uv sync --extra dev

      - name: Audit
        run: uv run pip-audit

  wheel:
    name: wheel build + install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: uv build --wheel

      - name: Create smoke venv
        run: uv venv .wheel-smoke

      - name: Install wheel
        run: uv pip install --python .wheel-smoke/bin/python dist/*.whl

      - name: Version smoke
        run: .wheel-smoke/bin/ctxproxy --version

      - name: Import smoke
        run: .wheel-smoke/bin/python -c "from ctxproxy.server import create_app; print('ok')"

  binary:
    name: pyinstaller smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Build one-file binary
        run: uv run --with pyinstaller pyinstaller --onefile --name ctxproxy scripts/ctxproxy_entry.py

      - name: Binary version smoke (unix)
        if: runner.os != 'Windows'
        run: ./dist/ctxproxy --version

      - name: Binary version smoke (windows)
        if: runner.os == 'Windows'
        run: .\dist\ctxproxy.exe --version

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wheel:
    name: wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Build
        run: uv build

      - name: Checksums
        run: sha256sum dist/* > dist/SHA256SUMS

      - name: Install smoke
        run: |
          uv venv .release-smoke
          uv pip install --python .release-smoke/bin/python dist/*.whl
          .release-smoke/bin/ctxproxy --version

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ctxproxy-dist
          path: dist/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes

  # Binary signing/notarization is intentionally split out: a real release
  # needs an Apple Developer ID certificate / Windows code-signing certificate
  # in repository secrets. Build artifacts are produced by the CI `binary` job.
  binaries:
    name: binary artifacts (unsigned)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Build one-file binary
        run: uv run --with pyinstaller pyinstaller --onefile --name ctxproxy scripts/ctxproxy_entry.py

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ctxproxy-${{ matrix.os }}-unsigned
          path: dist/ctxproxy*

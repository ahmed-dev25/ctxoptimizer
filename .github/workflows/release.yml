name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    name: wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Build
        run: uv build

      - name: Install smoke
        run: |
          uv venv .release-smoke
          uv pip install --python .release-smoke/bin/python dist/*.whl
          .release-smoke/bin/ctxproxy --version

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ctxproxy-dist
          path: dist/*

  # Binary signing/notarization is intentionally split out: a real release
  # needs an Apple Developer ID certificate / Windows code-signing certificate
  # in repository secrets. Build artifacts are unsigned.
  binaries:
    name: binary artifacts (unsigned)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Build one-file binary
        run: uv run --with pyinstaller pyinstaller --onefile --name ctxproxy scripts/ctxproxy_entry.py

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: cp dist/ctxproxy "dist/ctxproxy-${{ runner.os }}-${{ runner.arch }}"

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/ctxproxy.exe "dist/ctxproxy-${{ runner.os }}-${{ runner.arch }}.exe"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ctxproxy-${{ matrix.os }}-unsigned
          path: dist/ctxproxy-${{ runner.os }}-${{ runner.arch }}*

  publish:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [wheel, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: |
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* --clobber
          else
            case "${GITHUB_REF_NAME}" in
              *-alpha*|*-beta*|*-rc*) PRERELEASE="--prerelease" ;;
              *) PRERELEASE="" ;;
            esac
            gh release create "${GITHUB_REF_NAME}" release/* --generate-notes $PRERELEASE
          fi
